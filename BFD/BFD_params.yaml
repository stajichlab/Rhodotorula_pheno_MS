# BFD Pipeline Parameters — Exophiala genomes
# Usage: nextflow run ... -params-file BFD_exophiala_params.yaml

# ── Input / Paths ──────────────────────────────────────────────────────────────
pipeline: BFD
samples: samples.csv

run_setup: false
pep_dir: input/pep
genome_dir: input/dna

# ── Output directories ─────────────────────────────────────────────────────────
outdir: results/function
genome_stats_outdir: results/genome_stats
stats_outdir: results/seqstats

# this will allow building db/BFD.duckdb
run_build_duckdb: true

# glob every published result off disk for the MERGE_* steps instead of
# collecting off the live per-run channel -- with -resume, tools whose
# RUN_* tasks straddle multiple sessions (pfam, targetp) can otherwise
# lose data and their MERGE_* step silently never runs (see BUILD_DUCKDB
# failure 2026-08-15: tables/pfam.parquet and tables/targetP.parquet were
# never written even though all 276 genomes' raw outputs existed on disk).
merge_all: true

# ── Functional annotation tools ────────────────────────────────────────────────
skip_merge: false

run_pfam: true
run_cazy: true
run_merops: true
run_signalp: true
run_tmhmm: true
run_targetp: true
run_idp: true
run_wolfpsort: true
run_predgpi: true

# ── Sequence stats ─────────────────────────────────────────────────────────────
run_aa_freq: true
run_codon_freq: true

# ── Other analyses (ASM-dependent / GFF3-dependent — will warn/skip) ──────────
run_intergenic: true
run_gene_stats: true
run_asm_stats: true
run_busco_genome: true
run_busco_pep: true
